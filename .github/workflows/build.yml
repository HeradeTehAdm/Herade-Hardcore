name: Build and Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Build mod
        run: gradle build --no-daemon
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: herade-hardcore-build
          path: build/libs/*.jar
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v0.1.2"
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --title "Herade Hardcore 0.1.2" --notes "Обновление Herade Hardcore: полсердца после старта, запрет восстановления здоровья и ускоренный расход голода для Minecraft 26.3 (Fabric). JAR собран автоматически из main после успешной проверки GitHub Actions."
          gh release upload "$VERSION" build/libs/herade-hardcore-0.1.2.jar --clobber
